<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>Bejad Challenges</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Changa:wght@600;700;800&family=Tajawal:wght@400;500;700&display=swap">
<style>
  /* ===== نظام الألوان ===== */
  :root {
    --bg-deep:    #0F1226;  /* خلفية الليل العميقة */
    --bg-panel:   #1B2040;  /* لوحات وبطاقات */
    --bg-raised:  #262C52;  /* عناصر مرفوعة */
    --ink:        #F3F4FF;  /* النص الأساسي */
    --ink-dim:    #9AA0C7;  /* نص ثانوي */
    --accent:     #FF7A3D;  /* برتقالي الطاقة - زر اللعب */
    --accent-hot: #FF9A62;
    --teal:       #2DD4BF;  /* فيروزي - أزرار ثانوية */
    --gold:       #FFC94D;  /* ذهبي - العملات */
    --line:       #33395F;
  }

  * { margin: 0; padding: 0; box-sizing: border-box; -webkit-tap-highlight-color: transparent; }

  html, body { height: 100%; }

  body {
    background: var(--bg-deep);
    color: var(--ink);
    font-family: 'Tajawal', 'Segoe UI', system-ui, sans-serif;
    overflow: hidden;
    user-select: none;
    -webkit-user-select: none;
  }

  /* ===== نظام الشاشات ===== */
  .screen {
    position: fixed;
    inset: 0;
    display: none;
    flex-direction: column;
    padding: max(20px, env(safe-area-inset-top)) 24px max(24px, env(safe-area-inset-bottom));
    background:
      radial-gradient(120% 60% at 50% -10%, #232A5E 0%, transparent 60%),
      radial-gradient(90% 40% at 50% 110%, #1E1440 0%, transparent 60%),
      var(--bg-deep);
    overflow-y: auto;
  }
  .screen.active { display: flex; animation: screenIn .35s ease both; }

  @keyframes screenIn {
    from { opacity: 0; transform: translateY(12px); }
    to   { opacity: 1; transform: translateY(0); }
  }
  @media (prefers-reduced-motion: reduce) {
    .screen.active, .logo-badge, .btn { animation: none !important; transition: none !important; }
  }

  /* ===== الشريط العلوي ===== */
  .top-bar {
    display: flex;
    justify-content: space-between;
    align-items: center;
    min-height: 44px;
  }

  .coins-chip {
    display: inline-flex;
    align-items: center;
    gap: 8px;
    background: var(--bg-panel);
    border: 1px solid var(--line);
    border-radius: 999px;
    padding: 8px 16px;
    font-family: 'Changa', sans-serif;
    font-weight: 700;
    font-size: 18px;
    color: var(--gold);
    font-variant-numeric: tabular-nums;
  }
  .coins-chip .coin-icon {
    width: 22px; height: 22px;
    border-radius: 50%;
    background: radial-gradient(circle at 35% 30%, #FFE9A8, var(--gold) 55%, #C98F1B);
    box-shadow: 0 0 10px rgba(255, 201, 77, .45);
    flex-shrink: 0;
  }

  /* ===== الشاشة الرئيسية ===== */
  #screen-home .hero {
    flex: 1;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    gap: 14px;
    text-align: center;
    padding: 24px 0;
  }

  .logo-badge {
    width: 96px; height: 96px;
    border-radius: 28px;
    background: linear-gradient(145deg, var(--accent-hot), var(--accent) 60%, #D6541B);
    display: grid;
    place-items: center;
    font-family: 'Changa', sans-serif;
    font-weight: 800;
    font-size: 44px;
    color: #FFF4EC;
    box-shadow:
      0 12px 32px rgba(255, 122, 61, .35),
      inset 0 2px 0 rgba(255, 255, 255, .35);
    animation: floatBadge 3.2s ease-in-out infinite;
  }
  @keyframes floatBadge {
    0%, 100% { transform: translateY(0); }
    50%      { transform: translateY(-8px); }
  }

  .game-title {
    font-family: 'Changa', sans-serif;
    font-weight: 800;
    font-size: clamp(34px, 10vw, 46px);
    line-height: 1.15;
    text-wrap: balance;
    background: linear-gradient(180deg, #FFFFFF, #C9CEF5);
    -webkit-background-clip: text;
    background-clip: text;
    color: transparent;
  }

  .game-tagline {
    color: var(--ink-dim);
    font-size: 16px;
    font-weight: 500;
  }

  /* ===== الأزرار ===== */
  .menu {
    display: flex;
    flex-direction: column;
    gap: 14px;
    width: 100%;
    max-width: 340px;
    margin: 0 auto;
  }

  .btn {
    display: flex;
    align-items: center;
    justify-content: center;
    gap: 10px;
    width: 100%;
    min-height: 60px;
    border: none;
    border-radius: 18px;
    font-family: 'Changa', sans-serif;
    font-weight: 700;
    font-size: 20px;
    color: var(--ink);
    cursor: pointer;
    transition: transform .12s ease, filter .12s ease;
  }
  .btn:active { transform: scale(.96); filter: brightness(1.1); }
  .btn:focus-visible { outline: 3px solid var(--teal); outline-offset: 3px; }

  .btn-play {
    background: linear-gradient(145deg, var(--accent-hot), var(--accent) 55%, #E0601F);
    color: #FFF4EC;
    min-height: 68px;
    font-size: 24px;
    box-shadow: 0 10px 26px rgba(255, 122, 61, .38), inset 0 2px 0 rgba(255,255,255,.3);
  }

  .btn-secondary {
    background: var(--bg-raised);
    border: 1px solid var(--line);
    box-shadow: inset 0 1px 0 rgba(255,255,255,.06);
  }

  .btn .icon { font-size: 22px; line-height: 1; }

  /* ===== شاشات فرعية (ستُبنى في الخطوات القادمة) ===== */
  .sub-header {
    display: flex;
    align-items: center;
    gap: 12px;
    margin-bottom: 20px;
  }
  .back-btn {
    width: 44px; height: 44px;
    border-radius: 14px;
    border: 1px solid var(--line);
    background: var(--bg-raised);
    color: var(--ink);
    font-size: 20px;
    cursor: pointer;
    display: grid;
    place-items: center;
  }
  .back-btn:active { transform: scale(.94); }
  .sub-title {
    font-family: 'Changa', sans-serif;
    font-weight: 700;
    font-size: 26px;
  }

  .placeholder-box {
    flex: 1;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    gap: 12px;
    text-align: center;
    color: var(--ink-dim);
    border: 2px dashed var(--line);
    border-radius: 20px;
    padding: 32px 20px;
  }
  .placeholder-box .big { font-size: 40px; }

  .version-note {
    text-align: center;
    color: var(--ink-dim);
    font-size: 13px;
    margin-top: 18px;
  }
</style>
</head>
<body>

<!-- ========== الشاشة الرئيسية ========== -->
<div class="screen active" id="screen-home">
  <div class="top-bar">
    <div class="coins-chip">
      <span class="coin-icon"></span>
      <span id="coins-display">0</span>
    </div>
  </div>

  <div class="hero">
    <div class="logo-badge">B</div>
    <h1 class="game-title">Bejad Challenges</h1>
    <p class="game-tagline">٢٠ مرحلة من التحديات.. هل تستطيع الوصول للنهاية؟</p>
  </div>

  <nav class="menu">
    <button class="btn btn-play" onclick="goTo('screen-levels')">
      <span class="icon">▶</span> ابدأ اللعب
    </button>
    <button class="btn btn-secondary" onclick="goTo('screen-levels')">
      <span class="icon">🗺️</span> المراحل
    </button>
    <button class="btn btn-secondary" onclick="goTo('screen-settings')">
      <span class="icon">⚙️</span> الإعدادات
    </button>
  </nav>

  <p class="version-note">الإصدار التجريبي 0.1</p>
</div>

<!-- ========== شاشة المراحل (ستُبنى في الخطوة القادمة) ========== -->
<div class="screen" id="screen-levels">
  <div class="sub-header">
    <button class="back-btn" onclick="goTo('screen-home')" aria-label="رجوع">→</button>
    <h2 class="sub-title">المراحل</h2>
  </div>
  <div class="placeholder-box">
    <span class="big">🗺️</span>
    <p>خريطة المراحل ستُضاف في الخطوة القادمة</p>
  </div>
</div>

<!-- ========== شاشة الإعدادات (ستُبنى لاحقًا) ========== -->
<div class="screen" id="screen-settings">
  <div class="sub-header">
    <button class="back-btn" onclick="goTo('screen-home')" aria-label="رجوع">→</button>
    <h2 class="sub-title">الإعدادات</h2>
  </div>
  <div class="placeholder-box">
    <span class="big">⚙️</span>
    <p>الإعدادات ستُضاف في خطوة لاحقة</p>
  </div>
</div>

<script>
// ================= نظام التنقل بين الشاشات =================
function goTo(screenId) {
  document.querySelectorAll('.screen').forEach(s => s.classList.remove('active'));
  document.getElementById(screenId).classList.add('active');
}

// ================= عرض العملات المحفوظة =================
// نظام الحفظ الكامل سيُبنى في خطوة لاحقة - الآن فقط نقرأ الرصيد إن وُجد
let savedCoins = 0;
try {
  savedCoins = parseInt(localStorage.getItem('bejad_coins') || '0', 10) || 0;
} catch (e) { /* التخزين غير متاح - نعرض صفرًا */ }
document.getElementById('coins-display').textContent = savedCoins;
</script>

</body>
</html>
